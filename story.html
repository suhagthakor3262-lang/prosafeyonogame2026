<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProSafe Yono Stories</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Roboto, sans-serif; }
        .story-container { width: 100%; height: 100%; position: relative; max-width: 480px; margin: 0 auto; background: #111; }
        
        /* PROGRESS BARS SYSTEM */
        .progress-container { position: absolute; top: 15px; left: 10px; right: 10px; display: flex; gap: 5px; z-index: 100; }
        .progress-bar { flex: 1; height: 3px; background: rgba(255,255,255,0.3); border-radius: 2px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: #fff; }
        .progress-fill.active { animation: playStory 5s linear forwards; }
        .progress-fill.seen { width: 100%; }
        @keyframes playStory { from { width: 0%; } to { width: 100%; } }

        /* SLIDES INTERFACE */
        .slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: white; padding: 30px 20px; box-sizing: border-box; }
        .slide.active { display: flex; }
        .bg1 { background: linear-gradient(180deg, #1e3a8a, #0f172a); }
        .bg2 { background: linear-gradient(180deg, #1e1b4b, #0f172a); }
        .bg3 { background: linear-gradient(180deg, #111827, #1a237e); }
        
        .card-img { width: 110px; height: 110px; border-radius: 22px; border: 3px solid #fff; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        h1 { font-size: 28px; font-weight: 800; margin: 10px 0; text-transform: uppercase; letter-spacing: 0.5px; }
        p { font-size: 16px; color: #e2e8f0; margin-bottom: 30px; max-width: 280px; line-height: 1.4; }
        
        .btn { background: #f59e0b; color: #000; padding: 14px 40px; border-radius: 30px; font-weight: 800; text-decoration: none; font-size: 18px; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 4px 15px rgba(245,158,11,0.4); z-index: 20; position: relative; }
        
        /* TOUCH ENGINE NAVIGATION */
        .nav-zone { position: absolute; top: 0; height: 100%; width: 40%; z-index: 10; }
        .left-zone { left: 0; }
        .right-zone { right: 0; width: 60%; }
        .hint-text { font-size: 12px; color: #a1a1aa; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-top: 40px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="story-container">
        <!-- Progress System Lines -->
        <div class="progress-container">
            <div class="progress-bar"><div class="progress-fill" id="fill1"></div></div>
            <div class="progress-bar"><div class="progress-fill" id="fill2"></div></div>
            <div class="progress-bar"><div class="progress-fill" id="fill3"></div></div>
        </div>

        <!-- Touch Controls -->
        <div class="nav-zone left-zone" onclick="prevStory()"></div>
        <div class="nav-zone right-zone" onclick="nextStory()"></div>

        <!-- Slide 1: Main Platform Info -->
        <div class="slide active bg1" id="slide1">
            <img src="https://i.ibb.co/yBYVKhXR/file-000000002aa872089a44603a2278ac14.png" class="card-img">
            <h1>ProSafe Yono</h1>
            <p>Get Verified Clean Applications & Huge Bonuses Safely</p>
            <span class="hint-text">Tap Right to Start ➡️</span>
        </div>

        <!-- Slide 2: Yono Rummy Offer -->
        <div class="slide bg2" id="slide2">
            <img src="https://i.ibb.co/XxTS3tdZ/Screenshot-2026-0524-121950.png" class="card-img">
            <h1>Yono Rummy</h1>
            <p>Claim Verified Instant Sign-up Registration Bonus Packet</p>
            <a href="https://yonorummy043.com/?code=VIP3X1XWA3G&t=1780576965" class="btn">Download Now</a>
        </div>

        <!-- Slide 3: Spin 777 Slots -->
        <div class="slide bg3" id="slide3">
            <img src="https://i.ibb.co/m5xd7qpZ/Screenshot-2026-0524-122312.png" class="card-img">
            <h1>Spin 777 Slots</h1>
            <p>Launch High Return Algorithms Premium Slots Instantly</p>
            <a href="https://spin777dd.com/?code=7V9FYWPMDEW&t=1780577153" class="btn">Play Slots</a>
        </div>
    </div>

    <script>
        let currentSlide = 1;
        const totalSlides = 3;
        let storyTimeout;

        function runEngine() {
            clearTimeout(storyTimeout);
            
            // Sync progress lines look
            for(let i = 1; i <= totalSlides; i++) {
                let fill = document.getElementById('fill' + i);
                fill.className = 'progress-fill';
                if(i < currentSlide) fill.classList.add('seen');
                if(i === currentSlide) fill.classList.add('active');
            }

            // Auto switch slide after 5 seconds
            storyTimeout = setTimeout(() => {
                if(currentSlide < totalSlides) {
                    nextStory();
                }
            }, 5000);
        }

        function nextStory() {
            if(currentSlide < totalSlides) {
                document.getElementById('slide' + currentSlide).classList.remove('active');
                currentSlide++;
                document.getElementById('slide' + currentSlide).classList.add('active');
                runEngine();
            }
        }

        function prevStory() {
            if(currentSlide > 1) {
                document.getElementById('slide' + currentSlide).classList.remove('active');
                currentSlide--;
                document.getElementById('slide' + currentSlide).classList.add('active');
                runEngine();
            }
        }

        // Initialize script logic
        runEngine();
    </script>
</body>
</html>
