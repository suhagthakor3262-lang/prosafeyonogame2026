<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Add Game</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 500px; margin: auto; background: #f4f6f8; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input, textarea, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #28a745; color: white; font-weight: bold; cursor: pointer; border: none; font-size: 16px; }
    button:hover { background: #218838; }
    #status { font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🎮 Game Publishing Panel</h2>
    <p>Add new game details directly to Firebase Database:</p>
    
    <input type="text" id="gameTitle" placeholder="Game Title (e.g. Yono Rummy)">
    <input type="text" id="gameIcon" placeholder="Icon Image URL">
    <input type="text" id="downloadUrl" placeholder="APK Download Link">
    <input type="text" id="apkSize" placeholder="APK Size (e.g. 45 MB)">
    <textarea id="gameDesc" placeholder="Game Description" rows="4"></textarea>
    
    <button onclick="addGame()">Publish Game Now</button>
    <div id="status"></div>
  </div>

  <!-- Firebase v8 CDN -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDSNNC9JyNnRN06E6Nq2RJt6HwMKtRWHY",
      authDomain: "prosafe-yono-game.firebaseapp.com",
      projectId: "prosafe-yono-game",
      storageBucket: "prosafe-yono-game.firebasestorage.app",
      messagingSenderId: "403090633471",
      appId: "1:403090633471:web:4da0461124051c7acb52ca",
      measurementId: "G-F2PYRG1P5M"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const db = firebase.firestore();

    function addGame() {
      var title = document.getElementById('gameTitle').value;
      var icon = document.getElementById('gameIcon').value;
      var download = document.getElementById('downloadUrl').value;
      var size = document.getElementById('apkSize').value;
      var desc = document.getElementById('gameDesc').value;
      var statusDiv = document.getElementById('status');

      if (!title || !download) {
        alert("Title aur Download Link bharna zaruri hai!");
        return;
      }

      statusDiv.style.color = "blue";
      statusDiv.innerText = "Publishing game...";

      db.collection('games').add({
        title: title,
        icon: icon,
        downloadUrl: download,
        size: size,
        description: desc,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(function() {
        statusDiv.style.color = "green";
        statusDiv.innerText = "✅ Game successfully added to Firebase!";
        document.getElementById('gameTitle').value = '';
        document.getElementById('gameIcon').value = '';
        document.getElementById('downloadUrl').value = '';
        document.getElementById('apkSize').value = '';
        document.getElementById('gameDesc').value = '';
      }).catch(function(err) {
        statusDiv.style.color = "red";
        statusDiv.innerText = "❌ Error: " + err.message;
      });
    }
  </script>
</body>
</html>
