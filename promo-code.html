            const codeText = document.getElementById(elementId).innerText;

                btnElement.classList.add("copy-success");

        function moneyAnimation(button) {
            const rect = button.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const symbols = ["💵", "💸", "🪙", "✨", "💰"];

            for (let i = 0; i < 12; i++) {
                const money = document.createElement("span");
                money.className = "money-fly";
                money.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                money.style.left = centerX + "px";
                money.style.top = centerY + "px";

                money.style.setProperty("--x", Math.random() * 180 - 90);
                money.style.setProperty("--y", Math.random() * 160 - 100);
                money.style.setProperty("--rotate", (Math.random() * 90 - 45) + "deg");

                document.body.appendChild(money);

                setTimeout(() => {
                    money.remove();
                }, 1100);
            }
        }
    </script>
