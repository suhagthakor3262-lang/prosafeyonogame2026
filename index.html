<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProSafe Bet - Games</title>
    <!-- Official Logo -->
    <link rel="icon" href="https://i.ibb.co/SXrcFVvz/file-000000002aa872089a44603a2278ac14.png">
    <style>
        body { background-color: #f5f5f5; font-family: sans-serif; margin: 0; padding: 0; }
        .wrapper { max-width: 600px; margin: auto; background: #fff; min-height: 100vh; position: relative; }
        header { background: #1a2229; padding: 15px; color: #fff; display: flex; justify-content: space-between; align-items: center; }
        .search-area { padding: 15px; }
        #searchBox { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; }
        
        /* Fixed Buttons */
        .float-btns { position: fixed; right: 20px; bottom: 30px; z-index: 999; display: flex; flex-direction: column; gap: 10px; }
        .btn-round { width: 50px; height: 50px; border-radius: 10px; border: none; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        /* Tabs */
        .tabs { display: flex; gap: 10px; padding: 10px; justify-content: center; }
        .tab-btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; background: #ddd; }
        .tab-btn.active { background: #1e88e5; color: #fff; }
        
        /* Games Grid */
        .games-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 15px; }
        .game-card { background: #fff; border: 1px solid #eee; padding: 15px; border-radius: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .game-card img { width: 80px; height: 80px; border-radius: 50%; }
        .play-btn { display: block; margin-top: 10px; padding: 8px; background: #e3f2fd; color: #1e88e5; text-decoration: none; border-radius: 5px; font-weight: bold; }
        
        /* Slider */
        .slider { display: flex; overflow-x: auto; gap: 15px; padding: 15px; }
        .slider-item { min-width: 120px; background: #fff; padding: 10px; border-radius: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <div><strong>ProSafe Bet</strong></div>
        <div onclick="alert('Menu')">☰</div>
    </header>

    <div class="search-area">
        <input type="text" id="searchBox" placeholder="Search games..." oninput="searchFunc()">
    </div>

    <div class="tabs">
        <button id="btn-casino" class="tab-btn active" onclick="setTab('casino')">Casinos</button>
        <button id="btn-hot" class="tab-btn" onclick="setTab('hot')">Hot Game 🔥</button>
    </div>

    <div id="gameContainer" class="games-grid">
        <!-- Games Yahan dynamically filter hongi -->
        <div class="game-card" data-cat="casino"><img src="https://i.ibb.co/XxTS3tdZ/Screenshot-2026-0524-121950.png"><p>Yono Rummy</p><a href="#" class="play-btn">Play</a></div>
        <div class="game-card" data-cat="hot"><img src="https://i.ibb.co/Tq72gZFq/IMG-20260527-084621-601.jpg"><p>Spin 101</p><a href="#" class="play-btn">Play</a></div>
    </div>
</div>

<div class="float-btns">
    <button class="btn-round" style="background:#0088cc" onclick="window.open('https://t.me/invitnew')">✈️</button>
    <button class="btn-round" style="background:#72a0c1" onclick="window.scrollTo({top:0, behavior:'smooth'})">TOP</button>
</div>

<script>
    function setTab(cat) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + cat).classList.add('active');
        filterByCat(cat);
    }

    function filterByCat(cat) {
        document.querySelectorAll('.game-card').forEach(card => {
            card.style.display = (card.getAttribute('data-cat') === cat) ? 'block' : 'none';
        });
    }

    function searchFunc() {
        let val = document.getElementById('searchBox').value.toLowerCase();
        document.querySelectorAll('.game-card').forEach(card => {
            let name = card.querySelector('p').innerText.toLowerCase();
            card.style.display = name.includes(val) ? 'block' : 'none';
        });
    }
</script>
</body>
</html>
