<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found – ProSafe Yono Game 2026</title>

    <link rel="icon" type="image/webp" href="https://i.ibb.co/5xR0KL0d/Download-Real-Yono-Games-jpg.webp">
    <style>
        :root {
            --bg-cream: #f9f8f3;
            --forest-green: #0d2b1d;
            --emerald-accent: #0e5b38;
            --gold: #eab308;
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-cream);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-dark);
            text-align: center;
        }

        .card {
            background: #ffffff;
            border: 1.5px solid #e6e3d5;
            border-radius: 20px;
            padding: 40px 28px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 8px 30px rgba(13, 43, 29, 0.08);
        }

        .error-code {
            font-size: 72px;
            font-weight: 900;
            color: var(--forest-green);
            line-height: 1;
            margin-bottom: 8px;
            letter-spacing: -2px;
        }

        .error-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--forest-green);
            margin-bottom: 12px;
        }

        .error-desc {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.55;
            margin-bottom: 28px;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
            color: #0d2b1d;
            font-size: 15px;
            font-weight: 800;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 50px;
            border: 2px solid #ffffff;
            box-shadow: 0 4px 14px rgba(234, 179, 8, 0.4);
            transition: all 0.2s ease;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(234, 179, 8, 0.5);
        }

        .brand {
            margin-top: 32px;
            font-size: 13px;
            font-weight: 700;
            color: var(--emerald-accent);
        }

        .brand span {
            color: var(--forest-green);
            font-weight: 900;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="error-code">404</div>

        <p class="error-desc">
            Yeh page available nahi hai.<br>
            Shayad link galat hai ya page hata diya gaya hai.
        </p>
        <a href="/" class="btn-home">
            ← Back to Home
        </a>
        <div class="brand">
            <span>ProSafe Yono</span> Game 2026
        </div>

    <script>
        // Auto redirect after 8 seconds (optional)
        setTimeout(function() {
            window.location.href = "/";

</body>
</html>
